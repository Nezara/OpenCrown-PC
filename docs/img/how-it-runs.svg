<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a7a6a"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="14" fill="#faf6ef" stroke="#e0d6c4"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#3a2a1a">How the game runs</text>

  <!-- dump -->
  <rect x="30" y="150" width="170" height="110" rx="10" fill="#efe6f6" stroke="#8a6aaa" stroke-width="2"/>
  <text x="115" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#3a2a5a">Your dump</text>
  <text x="115" y="210" text-anchor="middle" font-size="13" fill="#4a3a6a">eboot.bin</text>
  <text x="115" y="228" text-anchor="middle" font-size="13" fill="#4a3a6a">+ game files</text>
  <text x="115" y="246" text-anchor="middle" font-size="11" fill="#6a5a8a">(read only)</text>

  <!-- loader -->
  <rect x="250" y="150" width="170" height="110" rx="10" fill="#e6eef8" stroke="#5a7aaa" stroke-width="2"/>
  <text x="335" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2a4a">Loader</text>
  <text x="335" y="210" text-anchor="middle" font-size="13" fill="#2a3a5a">maps the eboot</text>
  <text x="335" y="228" text-anchor="middle" font-size="13" fill="#2a3a5a">into memory,</text>
  <text x="335" y="246" text-anchor="middle" font-size="13" fill="#2a3a5a">2 byte patches</text>

  <!-- game code -->
  <rect x="470" y="130" width="200" height="150" rx="12" fill="#fbecc8" stroke="#c08a2a" stroke-width="3"/>
  <text x="570" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#5a3a0a">The game's own code</text>
  <text x="570" y="200" text-anchor="middle" font-size="13" fill="#6a4a1a">x86-64, same as on PS4,</text>
  <text x="570" y="218" text-anchor="middle" font-size="13" fill="#6a4a1a">runs directly on your CPU.</text>
  <text x="570" y="246" text-anchor="middle" font-size="13" fill="#6a4a1a">Gameplay, AI, menus,</text>
  <text x="570" y="264" text-anchor="middle" font-size="13" fill="#6a4a1a">netcode: all Vanillaware's.</text>

  <!-- libs -->
  <rect x="720" y="70" width="210" height="110" rx="10" fill="#e4f2e8" stroke="#4a9a6a" stroke-width="2"/>
  <text x="825" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1a4a2a">Translated PS4 libraries</text>
  <text x="825" y="126" text-anchor="middle" font-size="12.5" fill="#2a5a3a">kernel, files, audio, pad,</text>
  <text x="825" y="144" text-anchor="middle" font-size="12.5" fill="#2a5a3a">saves, fonts, network</text>
  <text x="825" y="164" text-anchor="middle" font-size="11" fill="#4a7a5a">→ Windows + SDL3</text>

  <!-- renderer -->
  <rect x="720" y="230" width="210" height="110" rx="10" fill="#f8e4e4" stroke="#b05a5a" stroke-width="2"/>
  <text x="825" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#5a1a1a">PC renderer</text>
  <text x="825" y="286" text-anchor="middle" font-size="12.5" fill="#6a2a2a">PS4 GPU command lists</text>
  <text x="825" y="304" text-anchor="middle" font-size="12.5" fill="#6a2a2a">rewritten for OpenGL</text>
  <text x="825" y="324" text-anchor="middle" font-size="11" fill="#8a4a4a">1080p or 4K (Pro mode)</text>

  <path d="M200 205 L246 205" stroke="#8a7a6a" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M420 205 L466 205" stroke="#8a7a6a" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M672 170 L716 135" stroke="#8a7a6a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M672 240 L716 275" stroke="#8a7a6a" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="30" y="372" font-size="12.5" fill="#6a5a4a">Everything blue, green and red is OpenCrown's own code. The gold box is your copy of the game, unchanged apart from two bytes.</text>
</svg>
